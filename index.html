<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)">
<title>Mexico 2026</title>
<style>
:root{
  color-scheme: light;
  --plane:#f5f0e8; --surface-1:#fffdf9; --surface-2:#f8f3eb;
  --ink-1:#1f1b16; --ink-2:#5b534a; --ink-3:#8c8377;
  --grid:#ebe3d6; --ring:rgba(31,27,22,0.11);
  --accent:#b5502a; --ok:#2f7a4f; --warn:#b97a0c; --warn-bg:#fbf1dc;
  --c-cdmx:#c2366b; --c-sma:#c07a12; --c-cun:#13827f;
  --radius:14px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --plane:#12110f; --surface-1:#1c1a17; --surface-2:#24211c;
    --ink-1:#f4eee5; --ink-2:#cdc4b6; --ink-3:#8f877b;
    --grid:#2e2a24; --ring:rgba(255,255,255,0.10);
    --accent:#e0794d; --ok:#55b97f; --warn:#e3a83a; --warn-bg:#2b2416;
    --c-cdmx:#e5679a; --c-sma:#e0a145; --c-cun:#3fbfba;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink-1);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
a{color:var(--accent);text-decoration:none;font-weight:550}
a:active{opacity:.6}
header{
  position:sticky; top:0; z-index:20;
  background:var(--surface-1); border-bottom:1px solid var(--ring);
  padding:10px 16px;
}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font:600 18px/1.2 var(--serif);margin:0;letter-spacing:-0.01em}
.brand h1 small{display:none;font:11px system-ui,sans-serif;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-left:6px}
@media (min-width:480px){ .brand h1 small{display:inline} }
.brand span{font-size:11px;color:var(--ink-3);white-space:nowrap}
.daysel{display:flex;align-items:center;gap:5px;margin-top:8px}
.daysel select{
  flex:1 1 0;min-width:0;min-height:38px;font:inherit;font-size:14px;color:var(--ink-1);
  background:var(--plane);border:1px solid var(--ring);border-radius:8px;padding:0 8px;
}
.daysel button{
  flex:0 0 auto;width:36px;min-height:38px;font-size:18px;line-height:1;padding:0;
  background:var(--plane);color:var(--ink-1);border:1px solid var(--ring);border-radius:8px;
}
.daysel button:disabled{opacity:.35}
main{padding:14px 16px;max-width:720px;margin:0 auto}
.card{
  background:var(--surface-1);border:1px solid var(--ring);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;
}
.card h2{font-size:12px;margin:0 0 10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.hide{display:none !important}
.pill{
  display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;
  border:1px solid var(--ring);color:var(--ink-2);background:var(--surface-2);
  text-transform:uppercase;letter-spacing:.05em;font-weight:650;vertical-align:1px;white-space:nowrap;
}
.pill.ok{color:var(--ok);border-color:var(--ok);background:transparent}
.pill.live{color:#fff;background:var(--accent);border-color:var(--accent)}
.pill.opt{border-style:dashed;background:transparent}
.pill.badge,.pill.acc{color:var(--accent);border-color:var(--accent);background:transparent}
.note{font-size:13px;color:var(--ink-2);line-height:1.5;margin:0}
.note + .note{margin-top:8px}
.todo{
  margin-top:7px;font-size:12.5px;color:var(--ink-1);line-height:1.45;
  border-left:3px solid var(--warn);background:var(--warn-bg);padding:5px 9px;border-radius:0 6px 6px 0;
}
.chip{
  display:inline-flex;align-items:center;min-height:28px;padding:0 9px;margin:2px 4px 2px 0;
  font:inherit;font-size:12px;font-weight:600;color:var(--ink-1);
  background:var(--surface-2);border:1px solid var(--ring);border-radius:999px;cursor:pointer;
  white-space:nowrap;flex:none;
}

/* ---- Today ---- */
.dayhero{border-top:4px solid var(--city)}
.dayhero .dow{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.dayhero h2.city{font:600 27px/1.15 var(--serif);color:var(--ink-1);text-transform:none;letter-spacing:-0.01em;margin:6px 0 4px}
.dayhero .sub{color:var(--ink-2);font-size:14px;margin:0}
.dayhero .stay{margin-top:10px;padding-top:10px;border-top:1px solid var(--grid);font-size:13.5px;color:var(--ink-2)}
.dayhero .stay b{color:var(--ink-1);font-weight:600}
.dayhero .pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.items{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--grid);position:relative}
.it:first-child{border-top:0;padding-top:2px}
.it .t{font-weight:650;font-size:13.5px;font-variant-numeric:tabular-nums;line-height:1.35}
.it .t em{display:block;font-style:normal;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-top:3px}
.it .d{font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.it .d .pill{margin-left:4px}
.it .mv{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:5px;font-size:12px;color:var(--ink-3)}
.it .mv span{white-space:nowrap}
.it .mv i{font-style:normal;text-transform:uppercase;font-size:10px;letter-spacing:.06em;margin-right:4px;color:var(--ink-3)}
.it .mv span.wrap{white-space:normal}
.it.now::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.it.past .t,.it.past .d,.it.past .mv{opacity:.55}
.foot{border-left:3px solid var(--city);background:var(--surface-2)}
.tmrw .kv{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--grid);font-size:14px}
.tmrw .kv:first-of-type{border-top:0}
.tmrw .kv b{flex:0 0 78px;font-variant-numeric:tabular-nums}
.backbtn{margin-bottom:12px}
.backbtn button{width:100%;min-height:42px;font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--accent);color:var(--accent);background:transparent}

/* ---- Trip ---- */
.trip-hero h2.big{font:600 26px/1.15 var(--serif);color:var(--ink-1);text-transform:none;letter-spacing:-0.01em;margin:0 0 4px}
.cityhd{display:flex;align-items:center;gap:8px;margin:0 0 2px}
.cityhd .dot{width:10px;height:10px;border-radius:50%;background:var(--city);flex:none}
.cityhd h3{font:600 19px/1.2 var(--serif);margin:0}
.cityhd small{margin-left:auto;color:var(--ink-3);font-size:12px;white-space:nowrap}
.citystays{font-size:12.5px;color:var(--ink-3);margin:0 0 8px 18px}
.dayrow{
  display:grid;grid-template-columns:46px 1fr;gap:10px;width:100%;text-align:left;
  padding:10px 0;border:0;border-top:1px solid var(--grid);background:none;color:inherit;font:inherit;cursor:pointer;
}
.dayrow .db{text-align:center;line-height:1.1;border-radius:9px;padding:5px 0;background:var(--surface-2);border:1px solid var(--ring)}
.dayrow .db small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.dayrow .db b{font-size:18px;font-variant-numeric:tabular-nums}
.dayrow.live .db{background:var(--accent);border-color:var(--accent);color:#fff}
.dayrow.live .db small{color:#fff}
.dayrow .dt{font-size:14px;min-width:0}
.dayrow .dt .ttl{font-weight:600}
.dayrow .dt .res{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

/* ---- Info / lists ---- */
.row{padding:9px 0;border-top:1px solid var(--grid);font-size:14px}
.row:first-of-type{border-top:0;padding-top:0}
.row .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .top b{font-weight:600}
.row .top span{color:var(--ink-3);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .meta{color:var(--ink-2);font-size:13px;margin-top:2px}
.row .links{display:flex;gap:14px;margin-top:4px;font-size:13px}
.steps{margin:4px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.steps li{margin:3px 0}

/* ---- Shop ---- */
.check{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--grid)}
.check:first-of-type{border-top:0;padding-top:0}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ok)}
.check .w b{font-weight:600}
.check .w .meta{font-size:13px;color:var(--ink-2);margin-top:2px}
.check .w .where{font-size:13px;margin-top:4px}
.check.done .w b{text-decoration:line-through;color:var(--ink-3)}
.check.done .w .meta,.check.done .w .where{opacity:.55}

/* ---- Ideas ---- */
.idea h3{font:600 17px/1.25 var(--serif);margin:0 0 6px}
.idea .lead{font-size:13.5px;color:var(--ink-2);margin:0 0 4px}
.opt{padding:10px 0 2px;border-top:1px solid var(--grid);margin-top:8px}
.opt .oh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600;font-size:14px}
.opt p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.ideasec{margin:22px 2px 10px}
.ideasec h2{font:600 21px/1.2 var(--serif);margin:0 0 2px;color:var(--ink-1)}
.ideasec p{margin:0;font-size:13px;color:var(--ink-3)}
.ideasec.other{margin-top:30px;padding-top:20px;border-top:2px solid var(--grid)}
.idea.dayidea{border-top:4px solid var(--city)}
.idea.other{background:var(--surface-2)}
.idea .idhd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.idea .idhd small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.idea .idhd h3{margin:1px 0 0}
.idea .db{flex:0 0 46px;text-align:center;line-height:1.1;border-radius:9px;padding:5px 0;background:var(--surface-2);border:1px solid var(--ring);color:var(--ink-1);font:inherit;cursor:pointer}
.idea .db small{font-size:10px;letter-spacing:.06em}
.idea .db b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.opt .rows{margin:6px 0 4px}
.opt .kv{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--grid);font-size:13.5px}
.opt .kv:first-child{border-top:0}
.opt .kv b{flex:0 0 76px;font-weight:650;font-variant-numeric:tabular-nums}
.opt .kv span{min-width:0;overflow-wrap:anywhere}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:650;margin:14px 0 0}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:var(--surface-1);border-top:1px solid var(--ring);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;min-height:60px;background:none;border:0;color:var(--ink-3);cursor:pointer;
  font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected=true]{color:var(--accent);font-weight:650}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1 id="brandName">Mexico 2026</h1>
    <span id="updTxt"></span>
  </div>
  <div class="daysel" id="daySel">
    <button id="prevD" aria-label="Previous day">&#8249;</button>
    <select id="dayPick" aria-label="Day"></select>
    <button id="nextD" aria-label="Next day">&#8250;</button>
  </div>
</header>

<main>
  <section id="tab-today"></section>
  <section id="tab-trip" class="hide"></section>
  <section id="tab-info" class="hide"></section>
  <section id="tab-shop" class="hide"></section>
  <section id="tab-ideas" class="hide"></section>
</main>

<nav>
  <button data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>Today</button>
  <button data-tab="trip"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h7a3.5 3.5 0 0 1 0 7H9a3.5 3.5 0 0 0 0 7h7"/></svg>Trip</button>
  <button data-tab="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Info</button>
  <button data-tab="shop"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>Shop</button>
  <button data-tab="ideas"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Ideas</button>
</nav>

<script>
/* =====================================================================
   Mexico 2026: day-by-day itinerary. One file, no build, no dependencies.
   Everything the page shows comes from the data blocks below; edit those,
   bump SITE_UPDATED, push to main. See CLAUDE.md.
   ===================================================================== */
const TRIP_NAME = 'Mexico 2026';
const TRIP_SUB  = 'Anniversary · Nov 2–14';
/* Bump on every commit that changes something you'd see on the site (UTC). */
const SITE_UPDATED = Date.parse('2026-10-28T16:21:52Z');
const YEAR = 2026, MONTH = 10;          // November (0-based)

/* Mexico City and San Miguel stay on UTC-6 all year; Cancún (Quintana Roo)
   is UTC-5 all year. Neither observes daylight saving. */
const CITIES = {
  cdmx: { name:'Mexico City',           tz:-6, color:'var(--c-cdmx)' },
  sma:  { name:'San Miguel de Allende', tz:-6, color:'var(--c-sma)'  },
  cun:  { name:'Cancún',                tz:-5, color:'var(--c-cun)'  },
};

const STAYS = {
  andaz:   { name:'Andaz Mexico City Condesa', addr:'Aguascalientes 158, Hipódromo Condesa', from:2, to:4,
             cin:'3:00 PM', cout:'11:00 AM', perks:'Daily breakfast for two, $100 property credit, room upgrade, early check-in and late checkout (when available)',
             map:'Andaz Mexico City Condesa Aguascalientes 158' },
  kimpton: { name:'Kimpton Virgilio',          addr:'Virgilio 7, Polanco', from:4, to:6,
             cin:'4:00 PM', cout:'12:00 PM', perks:'Daily breakfast for two, $100 property credit, guaranteed 4:00 PM late checkout, room upgrade and early check-in (when available)',
             map:'Kimpton Virgilio Polanco Mexico City' },
  numu:    { name:'NUMU',                      addr:'Nemesio Díez 20, Zona Centro, San Miguel de Allende', from:6, to:10,
             cin:'3:00 PM', cout:'12:00 PM',
             url:'https://www.hyatt.com/unbound-collection/en-US/bjxub-numu', map:'NUMU Boutique Hotel San Miguel de Allende Nemesio Diez 20' },
  secrets: { name:'Secrets Playa Blanca',      addr:'Carretera Punta Sam – Isla Blanca, Costa Mujeres', from:10, to:14,
             cin:'3:00 PM', cout:'11:00 AM', perks:'All-inclusive, Preferred Club junior suite',
             url:'https://www.hyatt.com/secrets/en-US/sepbc-secrets-playa-blanca-costa-mujeres', map:'Secrets Playa Blanca Costa Mujeres' },
};

/* ---------- The itinerary ----------
   d      date in November
   city   key into CITIES (sets the colour and the time zone)
   tz     optional override of the city's zone, for the times on that day
   stay   where you sleep that night; a change from the night before is flagged
   head   optional heading (defaults to the city name)
   sub    the one-line summary under the heading
   items  t = time as displayed; at = 24h start "HH:MM" (drives Now/Next and
          the day switch; leave off when the time is vague)
          d = details. Markup: [text](url), [text](map:Google Maps query), **bold**
          walk / ride = the two travel columns; ok = Confirmed / Reserved / Booked / Optional
          res = name for the Reservations list; todo = shows amber here and in Info → Still to sort
   note   footnote under the day */
const DAYS = [
{ d:2, city:'cdmx', stay:'andaz', sub:'Arrival + Día de Muertos + Taverna',
  items:[
  { t:'6:00 AM', d:'American AA1524, San Luis Obispo → Phoenix, lands 8:55 AM (local times).' },
  { t:'11:42 AM', d:'American AA501, Phoenix → Mexico City (Phoenix time).' },
  { t:'3:55 PM', at:'15:55', d:'Land at MEX. Allow about an hour for immigration, bags and customs.' },
  { t:'~5:00', at:'17:00', d:'Airport → [Andaz Mexico City Condesa](map:Andaz Mexico City Condesa Aguascalientes 158). Check in and drop the bags.', walk:'Not practical', ride:'~30–60 min' },
  { t:'~6:30', at:'18:30', d:'Uber to the [Palacio de Bellas Artes](map:Palacio de Bellas Artes Mexico City), **Avenida Juárez side**. It’s on the edge of Centro, so the car stays out of the jammed streets around the Zócalo. **If traffic is too heavy:** the Torre Latinoamericana corner (Eje Central and Madero), or the south option: [Izazaga at 20 de Noviembre](map:Jose Maria Izazaga y 20 de Noviembre Centro CDMX), then walk straight up 20 de Noviembre to the Zócalo (~10 min), staying on 20 de Noviembre rather than heading east.', walk:'~75–90 min', ride:'~25–40 min' },
  { t:'~7:00', at:'19:00', d:'Walk Madero, the pedestrian street, to the [Zócalo](map:Zocalo Mexico City).', walk:'~15 min' },
  { t:'~7:15–7:45', at:'19:15', d:'The Zócalo after dark, lit up for Día de Muertos, with its free Ofrenda Monumental: a 32-meter catrina honoring José Guadalupe Posada. Tonight is its last night. **Optional 5–10 min:** peek into the [Gran Hotel Ciudad de México](map:Gran Hotel Ciudad de Mexico) lobby for its stained-glass ceiling if access is open to non-guests.', walk:'Explore on foot' },
  { t:'~7:45', at:'19:45', d:'Walk to [Taverna](map:Taverna Prim Mexico City): back along Madero to Bellas Artes (your first time on Madero if you came in from the south), along the Alameda on Avenida Juárez, then down Bucareli; General Prim is just off it. Stay on the busy main streets, keep phones and wallets in front pockets in the crowds, and don’t wander into the side streets north and east of the Zócalo. Tired? Get an Uber at Bellas Artes for the last stretch.', walk:'~40–45 min in all', ride:'From Bellas Artes ~10–20 min' },
  { t:'8:30 PM', at:'20:30', d:'[Taverna](map:Taverna Prim Mexico City), table for two under Jen (OpenTable). Afterwards, an Uber back is the easy call after a long travel day. If you’d rather walk (~40 min, ~3 km), stay on the main avenues: Bucareli south to Avenida Chapultepec, west to the Glorieta de Insurgentes, then south on Insurgentes to the Andaz at Aguascalientes.', ok:'Confirmed', res:'Taverna', walk:'To the Andaz ~40 min', ride:'To the Andaz ~15–25 min' },
  ],
  note:'Running late from the airport? Backup plans are on the Ideas tab. The Zócalo’s ofrenda comes down after tonight, so Tuesday’s walk won’t catch it. Avenida Amsterdam and Parque México move to Tuesday morning’s breakfast loop.' },

{ d:3, city:'cdmx', stay:'andaz', sub:'Centro audio walk + Botánico + Roma + Lucha Libre',
  items:[
  { t:'7:45', at:'07:45', ok:'Optional', d:'**Jen, if she wants the library:** breakfast together at 7:00, then Uber to [Biblioteca Vasconcelos](https://www.bibliotecavasconcelos.gob.mx/) for an 8:30–9:15 visit and on to Templo Mayor (~15–25 min) to meet Drew at ~9:45. Check its hours the day before (it closed without warning in 2025), and share Uber trips so you can see where the other is.', walk:'Not practical', ride:'~20–30 min' },
  { t:'8:00–9:00', at:'08:00', d:'Slow breakfast: [Saint Panadería](map:Saint Panaderia Benjamin Hill 146 Mexico City), [Odette Condesa](map:Odette Condesa Popocatepetl 35 Mexico City), or the Andaz (breakfast for two is included). Then a loop of [Parque México](map:Parque Mexico Condesa Mexico City) and [Avenida Amsterdam](map:Avenida Amsterdam Condesa Mexico City).', walk:'Saint ~10–15; Odette ~5–10', ride:'Unneeded' },
  { t:'~9:15', at:'09:15', d:'Uber to [Templo Mayor](map:Templo Mayor Mexico City). Buy and download the audio tour on hotel wifi first.', walk:'Not practical', ride:'~25–40 min' },
  { t:'9:45–11:45', at:'09:45', d:'**Self-guided audio walk, east to west:** [Templo Mayor](map:Templo Mayor Mexico City) (from outside) and the [Zócalo](map:Zocalo Mexico City) → along Madero: [Palacio de Iturbide](map:Palacio de Iturbide Mexico City) courtyard if open, [Casa de los Azulejos](map:Casa de los Azulejos Mexico City) → **go inside** [Palacio Postal](map:Palacio Postal Mexico City) for ~10–15 min to see the ornate lobby/staircase → [Bellas Artes](https://inba.gob.mx/recinto/67/museo-del-palacio-de-bellas-artes) → [MUNAL](https://munal.mx/es/visita). Audio: VoiceMap’s “Mexico City’s Historical Sights” (~75 min, about $20) or “Mexico City’s Aztec Origins” (~90 min, about $15).', walk:'2–7 min between sights' },
  { t:'~11:45', at:'11:45', ok:'Optional', d:'**Depending on mood:** the [Museo de Arte Popular](map:Museo de Arte Popular Revillagigedo 11 CDMX) (Revillagigedo 11) for ~40 min instead of MUNAL: alebrijes, Talavera, Huichol beadwork and trees of life. Open Tuesday to Sunday from 10:00.', walk:'~5–10 min from Bellas Artes, through the Alameda' },

/* =====================================================================
   Engine
   ===================================================================== */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const DOW  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON  = 'November';

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function href(u){ return u.startsWith('map:') ? 'https://maps.google.com/?q=' + encodeURIComponent(u.slice(4)).replace(/%20/g,'+') : u; }
function fmt(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
/* [text](url) and **bold**. Bold must not span a link. */
function md(s){
  const out = [], re = /\[([^\]]+)\]\(([^)]+)\)/g;
  let last = 0, m;
  while((m = re.exec(s))){
    out.push(fmt(s.slice(last, m.index)));
    out.push('<a href="' + esc(href(m[2])) + '" target="_blank" rel="noopener">' + fmt(m[1]) + '</a>');
    last = re.lastIndex;
  }
  out.push(fmt(s.slice(last)));
  return out.join('');
}
function plain(s){ return s.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\*\*/g, ''); }
function brk(t){ return esc(t).replace(/–/g, '–<wbr>'); }

const dayIdx  = d => DAYS.findIndex(x => x.d === d);
const dayTz   = D => (D.tz != null ? D.tz : CITIES[D.city].tz);
const dowOf   = d => new Date(Date.UTC(YEAR, MONTH, d)).getUTCDay();
const shortDay = d => DOW[dowOf(d)].slice(0,3) + ' ' + d;
const longDay  = d => DOW[dowOf(d)] + ', ' + MON + ' ' + d;
const headOf   = D => D.head || CITIES[D.city].name;

/* An instant given as local wall-clock time in a fixed UTC offset. */
function utcAt(date, hhmm, tz){
  const [h, m] = hhmm.split(':').map(Number);
  return Date.UTC(YEAR, MONTH, date, h - tz, m);
}
/* A day "opens" (becomes Today) at 3 AM local, so a late dinner still shows
   that day's plan. A day whose first fixed time is before 5 AM opens at 8 PM
   the evening before instead (none at the moment: the 10th's pickup is 5:00). */
function dayOpens(i){
  const D = DAYS[i], first = D.items.find(x => x.at);
  if(i > 0 && first && first.at < '05:00'){
    const P = DAYS[i - 1];
    return utcAt(P.d, '20:00', dayTz(P));
  }
  return utcAt(D.d, '03:00', dayTz(D));
}
const TRIP_END = utcAt(DAYS[DAYS.length - 1].d + 1, '03:00', dayTz(DAYS[DAYS.length - 1]));
/* -1 before the trip, else the index of the day that is Today. */
function liveDay(now){
  let k = -1;
  for(let i = 0; i < DAYS.length; i++) if(now >= dayOpens(i)) k = i;
  return k;
}
function phase(now){ return now < dayOpens(0) ? 'before' : now >= TRIP_END ? 'after' : 'during'; }
/* Whole days from now until a date, counted in that day's zone. */
function daysUntil(now, i){
  const D = DAYS[i], tz = dayTz(D);
  const loc = new Date(now + tz * 3600e3);
  const today = Date.UTC(loc.getUTCFullYear(), loc.getUTCMonth(), loc.getUTCDate());
  return Math.round((Date.UTC(YEAR, MONTH, D.d) - today) / 864e5);
}
/* Which item is happening now / next, on the live day only. */
function nowNext(i, now){
  const D = DAYS[i], loc = new Date(now + dayTz(D) * 3600e3);
  const sameDay = loc.getUTCMonth() === MONTH && loc.getUTCDate() === D.d;
  const before  = Date.UTC(loc.getUTCFullYear(), loc.getUTCMonth(), loc.getUTCDate()) < Date.UTC(YEAR, MONTH, D.d);
  const hm = String(loc.getUTCHours()).padStart(2,'0') + ':' + String(loc.getUTCMinutes()).padStart(2,'0');
  let cur = -1, nxt = -1;
  D.items.forEach((x, k) => {
    if(!x.at) return;
    if(sameDay && x.at <= hm) cur = k;
    else if(nxt < 0 && (before || (sameDay && x.at > hm))) nxt = k;
  });
  return { cur, nxt };
}

const STATUS = { Confirmed:'ok', Reserved:'ok', Booked:'ok', Optional:'opt', Suggested:'acc' };
function pill(s){ return '<span class="pill ' + (STATUS[s] || '') + '">' + esc(s) + '</span>'; }
function moveLine(x){
  const bits = [];
  const skip = v => !v || v === '-' ;
  if(x.walk && x.ride && x.walk === x.ride) bits.push('<span>' + esc(x.walk) + '</span>');
  else {
    if(!skip(x.walk)) bits.push('<span class="' + (x.walk.length > 24 ? 'wrap' : '') + '"><i>Walk</i>' + esc(x.walk) + '</span>');
    if(!skip(x.ride)) bits.push('<span class="' + (x.ride.length > 24 ? 'wrap' : '') + '"><i>Car</i>' + esc(x.ride) + '</span>');
  }
  return bits.length ? '<div class="mv">' + bits.join('') + '</div>' : '';
}
function dayChip(d, label){ return '<button class="chip" data-day="' + d + '">' + esc(label || shortDay(d)) + '</button>'; }

/* ---------- state ---------- */
let tab = 'today', cur = 0, lastLive = null;
const NOW = () => Date.now();

/* ---------- Today ---------- */
function renderToday(){
  const now = NOW(), live = liveDay(now), ph = phase(now);
  const D = DAYS[cur], C = CITIES[D.city], prev = DAYS[cur - 1];
  const isLive = ph === 'during' && cur === live;
  const nn = isLive ? nowNext(cur, now) : { cur:-1, nxt:-1 };
  let h = '';

  if(ph === 'during' && cur !== live && live >= 0){
    h += '<div class="backbtn"><button data-day="' + DAYS[live].d + '">Back to today, ' + esc(shortDay(DAYS[live].d)) + '</button></div>';
  }

  const pills = [];
  if(isLive) pills.push('<span class="pill live">Today</span>');
  else if(ph === 'before' && cur === 0){
    const n = daysUntil(now, 0);
    pills.push('<span class="pill">' + (n <= 1 ? (n === 1 ? 'Tomorrow' : 'Today') : 'In ' + n + ' days') + '</span>');
  }
  if(D.badge) pills.push('<span class="pill badge">' + esc(D.badge) + '</span>');
  pills.push('<span class="pill">Day ' + (cur + 1) + ' of ' + DAYS.length + '</span>');

  let stay = '';
  if(D.stay){
    const S = STAYS[D.stay], P = prev && prev.stay ? STAYS[prev.stay] : null;
    const link = '<a href="' + esc(S.url || href('map:' + S.map)) + '" target="_blank" rel="noopener">' + esc(S.name) + '</a>';
    stay = (P && prev.stay !== D.stay)
      ? '<b>Hotel change:</b> ' + esc(P.name) + ' (out by ' + esc(P.cout) + ') → ' + link + ' (check-in ' + esc(S.cin) + ')'
      : cur === 0 ? '<b>Check in:</b> ' + link + ' (from ' + esc(S.cin) + ')' : '<b>Staying:</b> ' + link;
  } else if(prev && prev.stay){
    stay = '<b>Check out:</b> ' + esc(STAYS[prev.stay].name) + ' (by ' + esc(STAYS[prev.stay].cout) + ')';
  }

  h += '<div class="card dayhero" style="--city:' + C.color + '">'
     +   '<div class="pills">' + pills.join('') + '</div>'
     +   '<div class="dow">' + esc(longDay(D.d)) + '</div>'
     +   '<h2 class="city">' + esc(headOf(D)) + '</h2>'
     +   '<p class="sub">' + esc(D.sub) + '</p>'
     +   (stay ? '<div class="stay">' + stay + '</div>' : '')
     + '</div>';

  h += '<div class="card"><ul class="items">';
  D.items.forEach((x, k) => {
    const cls = ['it'];
    let tag = '';
    if(k === nn.cur){ cls.push('now'); tag = '<em>Now</em>'; }
    else if(k === nn.nxt){ cls.push('now'); tag = '<em>Next</em>'; }
    else if(isLive && nn.cur >= 0 && x.at && k < nn.cur) cls.push('past');
    h += '<li class="' + cls.join(' ') + '">'
       +   '<div class="t">' + brk(x.t) + tag + '</div>'
       +   '<div class="d">' + md(x.d) + (x.ok ? ' ' + pill(x.ok) : '')
       +     moveLine(x)
       +     (x.todo ? '<div class="todo">' + md(x.todo) + '</div>' : '')
       +   '</div>'
       + '</li>';
  });
  h += '</ul></div>';

  if(D.note || D.todo){
    h += '<div class="card foot" style="--city:' + C.color + '">'
       + (D.note ? '<p class="note">' + md(D.note) + '</p>' : '')
       + (D.todo ? '<div class="todo">' + md(D.todo) + '</div>' : '')
       + '</div>';
  }

  const N = DAYS[cur + 1];
  if(N){
    const show = N.items.slice(0, 2);
    const change = N.stay && D.stay !== N.stay ? '<div class="kv"><b>Hotel</b><span>Move to ' + esc(STAYS[N.stay].name) + '</span></div>' : '';
    h += '<div class="card tmrw"><h2>' + (isLive ? 'Tomorrow' : 'Next day') + ' · ' + esc(shortDay(N.d)) + ' · ' + esc(headOf(N)) + '</h2>'
       + show.map(x => '<div class="kv"><b>' + brk(x.t) + '</b><span>' + esc(plain(x.d)) + '</span></div>').join('')
       + change
       + '<div style="margin-top:8px">' + dayChip(N.d, 'Open ' + shortDay(N.d) + ' →') + '</div>'
       + '</div>';
  }
  $('#tab-today').innerHTML = h;
}

/* ---------- Trip ---------- */
function renderTrip(){
  const now = NOW(), live = liveDay(now), ph = phase(now);
  let h = '<div class="card trip-hero"><h2 class="big">' + esc(TRIP_NAME) + '</h2>'
        + '<p class="note">Anniversary trip: Mexico City, San Miguel de Allende and Cancún. ' + DAYS.length + ' days, November ' + DAYS[0].d + '–' + DAYS[DAYS.length-1].d + '.</p>';
  if(ph === 'before'){
    const n = daysUntil(now, 0);
    h += '<p class="note" style="margin-top:6px"><span class="pill live">' + (n > 1 ? n + ' days to go' : n === 1 ? 'Tomorrow' : 'Today') + '</span></p>';
  }
  h += '</div>';

  const groups = [];
  DAYS.forEach((D, i) => {
    const g = groups[groups.length - 1];
    if(g && g.city === D.city) g.idx.push(i); else groups.push({ city:D.city, idx:[i] });
  });
  groups.forEach(g => {
    const C = CITIES[g.city];
    const first = DAYS[g.idx[0]].d, last = DAYS[g.idx[g.idx.length - 1]].d;
    const stays = [...new Set(g.idx.map(i => DAYS[i].stay).filter(Boolean))].map(k => STAYS[k]);
    h += '<div class="card" style="--city:' + C.color + '">'
       +   '<div class="cityhd"><span class="dot"></span><h3>' + esc(C.name) + '</h3><small>Nov ' + first + (last !== first ? '–' + last : '') + '</small></div>'
       +   '<p class="citystays">' + stays.map(S => esc(S.name) + ' (' + S.from + '–' + S.to + ')').join(' · ') + '</p>';
    g.idx.forEach(i => {
      const D = DAYS[i];
      const res = D.items.filter(x => x.res).map(x => '<span class="pill ok">' + esc(x.res.replace(/ \(.*\)$/, '')) + '</span>');
      if(D.badge) res.unshift('<span class="pill badge">' + esc(D.badge) + '</span>');
      const isLive = ph === 'during' && i === live;
      h += '<button class="dayrow' + (isLive ? ' live' : '') + '" data-day="' + D.d + '">'
         +   '<span class="db"><small>' + DOW[dowOf(D.d)].slice(0,3) + '</small><b>' + D.d + '</b></span>'
         +   '<span class="dt"><span class="ttl">' + esc(D.head && D.head !== C.name ? D.head + ': ' : '') + esc(D.sub) + '</span>'
         +     (res.length ? '<span class="res">' + res.join('') + '</span>' : '')
         +   '</span>'
         + '</button>';
    });
    h += '</div>';
  });
  $('#tab-trip').innerHTML = h;
}

/* ---------- Info ---------- */
function ago(ms){
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if(s < 90) return 'just now';
  const m = s / 60; if(m < 60) return Math.round(m) + ' min ago';
  const hr = m / 60; if(hr < 36) return Math.round(hr) + ' h ago';
  return Math.round(hr / 24) + ' days ago';
}
function renderInfo(){
  let h = '';

  h += '<div class="card"><h2>Where you’re staying</h2>';
  Object.values(STAYS).forEach(S => {
    const n = S.to - S.from;
    h += '<div class="row"><div class="top"><b>' + esc(S.name) + '</b><span>Nov ' + S.from + '–' + S.to + ' · ' + n + ' night' + (n > 1 ? 's' : '') + '</span></div>'
       + '<div class="meta">' + esc(S.addr) + '</div>'
       + '<div class="meta">Check-in ' + esc(S.cin) + ' ' + esc(shortDay(S.from).slice(0, 3)) + ' · check-out ' + esc(S.cout) + ' ' + esc(shortDay(S.to).slice(0, 3)) + '</div>'
       + (S.perks ? '<div class="meta">' + esc(S.perks) + '</div>' : '')
       + '<div class="links">' + (S.url ? '<a href="' + esc(S.url) + '" target="_blank" rel="noopener">Website</a>' : '')
       + '<a href="' + esc(href('map:' + S.map)) + '" target="_blank" rel="noopener">Map</a></div></div>';
  });
  h += '</div>';

  h += '<div class="card"><h2>Travel days</h2>';
  TRAVEL.forEach(T => {
    h += '<div class="row"><div class="top"><b>' + esc(T.h) + '</b>' + dayChip(T.d) + '</div>'
       + '<ul class="steps">' + T.lines.map(l => '<li>' + md(l) + '</li>').join('') + '</ul></div>';
  });
  h += '</div>';

  const res = [];
  DAYS.forEach(D => D.items.forEach(x => { if(x.res) res.push({ D, x }); }));
  h += '<div class="card"><h2>Reservations</h2>';
  res.forEach(({ D, x }) => {
    h += '<div class="row"><div class="top"><b>' + esc(x.res) + '</b><span>' + esc(shortDay(D.d)) + (x.at ? ' · ' + esc(x.t) : '') + '</span></div>'
       + '<div class="meta">' + pill(x.ok) + '</div></div>';
  });
  h += '</div>';

  const todos = [];
  DAYS.forEach(D => {
    D.items.forEach(x => { if(x.todo) todos.push({ D, t:x.todo }); });
    if(D.todo) todos.push({ D, t:D.todo });
  });
  h += '<div class="card"><h2>Still to sort</h2>';
  todos.forEach(({ D, t }) => {
    h += '<div class="row"><div class="top"><span style="white-space:normal;color:var(--ink-1);font-size:14px">' + md(t) + '</span>' + dayChip(D.d) + '</div></div>';
  });
  h += '</div>';

  h += '<div class="card"><h2>Time zones</h2>'
     + '<p class="note"><b>Mexico City and San Miguel:</b> UTC−6, two hours ahead of Los Angeles in November.</p>'
     + '<p class="note"><b>Cancún:</b> UTC−5, one hour ahead of San Miguel and three ahead of Los Angeles. You lose an hour on the QRO → CUN flight.</p>'
     + '<p class="note">Neither observes daylight saving, and phones switch on their own. Every time on this site is local to where you are that day.</p>'
     + '</div>';

  h += '<div class="card"><h2>About this site</h2>'
     + '<p class="note">It opens on today’s plan once the trip starts. Each day takes over at 3 AM local time, so a late dinner still shows that night’s plan.</p>'
     + '<p class="note">Tap any place to open it in Google Maps. When the plan changes, an open page reloads itself with the new version.</p>'
     + '<p class="note">Plan last updated ' + esc(ago(SITE_UPDATED)) + '.</p>'
     + '</div>';

  $('#tab-info').innerHTML = h;
}

/* ---------- Shop ---------- */
const SHOP_KEY = 'mx26.shop';
function shopGet(){ try{ return JSON.parse(localStorage.getItem(SHOP_KEY) || '[]'); }catch(e){ return []; } }
function shopSet(a){ try{ localStorage.setItem(SHOP_KEY, JSON.stringify(a)); }catch(e){} }
function renderShop(){
  const done = new Set(shopGet());
  let h = '<div class="card"><p class="note">' + md(SHOP_NOTE) + '</p></div>';
  SHOP.forEach(sec => {
    h += '<div class="card"><h2>' + esc(sec.h) + '</h2>';
    sec.items.forEach(x => {
      const on = done.has(x.id);
      h += '<label class="check' + (on ? ' done' : '') + '"><input type="checkbox" data-shop="' + x.id + '"' + (on ? ' checked' : '') + '>'
         + '<span class="w"><b>' + esc(x.b) + '</b><div class="meta">' + md(x.m) + '</div>'
         + (x.w ? '<div class="where">' + md(x.w) + '</div>' : '')
         + (x.on ? '<div class="where">' + x.on.map(d => dayChip(d)).join('') + '</div>' : '')
         + '</span></label>';
    });
    h += '</div>';
  });
  h += '<p class="note" style="text-align:center;color:var(--ink-3)">Ticks are saved on this phone only.</p>';
  $('#tab-shop').innerHTML = h;
}

/* ---------- Ideas ---------- */
function renderIdeas(){
  let h = '<div class="card"><p class="note"><b>Changes you’re considering.</b> Nothing on this tab is in the plan yet. Once you decide, it moves into the day and comes off this list.</p></div>';
  const opt = (o, chip) => '<div class="opt"><div class="oh">' + (chip ? dayChip(o.day) : '') + '<span>' + esc(o.h) + '</span>' + (o.tag ? pill(o.tag) : '') + '</div>'
         + (o.rows ? '<div class="rows">' + o.rows.map(r => '<div class="kv"><b>' + brk(r[0]) + '</b><span>' + md(r[1]) + '</span></div>').join('') + '</div>' : '')
         + (o.p ? '<p>' + md(o.p) + '</p>' : '')
         + '</div>';
  const byDay = IDEAS.filter(I => I.day).sort((a, b) => a.day - b.day), other = IDEAS.filter(I => !I.day);

  h += '<div class="ideasec"><h2>Day by day</h2><p>Revised plans for specific days, in trip order. Tap the date to open that day.</p></div>';
  byDay.forEach(I => {
    const D = DAYS[dayIdx(I.day)];
    h += '<div class="card idea dayidea" style="--city:' + CITIES[D.city].color + '">'
       +   '<div class="idhd"><button class="db" data-day="' + D.d + '"><small>' + DOW[dowOf(D.d)].slice(0,3) + '</small><b>' + D.d + '</b></button>'
       +   '<div><small>' + esc(longDay(D.d)) + '</small><h3>' + esc(I.h) + '</h3></div></div>'
       +   '<p class="lead">' + md(I.lead) + '</p>'
       +   I.opts.map(o => opt(o, false)).join('')
       + '</div>';
  });

  h += '<div class="ideasec other"><h2>Other ideas</h2><p>Not tied to one day’s plan yet. Each option shows the day it would fit.</p></div>';
  other.forEach((I, n) => {
    h += '<div class="card idea other"><h3>' + (n + 1) + '. ' + esc(I.h) + '</h3><p class="lead">' + md(I.lead) + '</p>';
    I.opts.forEach(o => {
      h += opt(o, true);
    });
    h += '</div>';
  });
  $('#tab-ideas').innerHTML = h;
}

/* ---------- shell ---------- */
const RENDER = { today:renderToday, trip:renderTrip, info:renderInfo, shop:renderShop, ideas:renderIdeas };
function renderHeader(){
  $('#brandName').innerHTML = esc(TRIP_NAME) + '<small>' + esc(TRIP_SUB) + '</small>';
  $('#updTxt').textContent = 'Updated ' + ago(SITE_UPDATED);
  $('#daySel').classList.toggle('hide', tab !== 'today');
  $('#dayPick').value = String(cur);
  $('#prevD').disabled = cur === 0;
  $('#nextD').disabled = cur === DAYS.length - 1;
}
function render(){
  renderHeader();
  RENDER[tab]();
}
function show(t){
  tab = t;
  $$('main > section').forEach(s => s.classList.toggle('hide', s.id !== 'tab-' + t));
  $$('nav button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  render();
  window.scrollTo(0, 0);
}
function goDay(d){
  const i = dayIdx(d);
  if(i < 0) return;
  cur = i;
  show('today');
}

$('#dayPick').innerHTML = DAYS.map((D, i) => '<option value="' + i + '">' + esc(shortDay(D.d) + ' · ' + headOf(D)) + '</option>').join('');
$('#dayPick').addEventListener('change', e => { cur = +e.target.value; render(); window.scrollTo(0, 0); });
$('#prevD').addEventListener('click', () => { if(cur > 0){ cur--; render(); window.scrollTo(0, 0); } });
$('#nextD').addEventListener('click', () => { if(cur < DAYS.length - 1){ cur++; render(); window.scrollTo(0, 0); } });
$$('nav button').forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
document.addEventListener('click', e => {
  const b = e.target.closest('[data-day]');
  if(b){ e.preventDefault(); goDay(+b.dataset.day); }
});
document.addEventListener('change', e => {
  const id = e.target.dataset && e.target.dataset.shop;
  if(!id) return;
  const s = new Set(shopGet());
  if(e.target.checked) s.add(id); else s.delete(id);
  shopSet([...s]);
  e.target.closest('.check').classList.toggle('done', e.target.checked);
});

/* ---------- Picking up code updates ----------
   GitHub Pages serves this file with a 10-minute cache and Safari holds it
   longer, so a plan change might not show on reload. The page fetches a fresh,
   cache-busted copy of itself, hashes its script and compares it with the one
   running; on a mismatch it reloads onto ?v=<build>, a URL nothing has cached.
   `v` also stops a loop. Same mechanism as the Sand Valley site. */
function strHash(str){
  let h = 5381;
  for(let i = 0; i < str.length; i++) h = (Math.imul(h, 33) ^ str.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
const SELF_SRC = (document.currentScript && document.currentScript.textContent) || '';
const BUILD = strHash(SELF_SRC);
let lastUpdCheck = 0;
async function checkForUpdate(){
  if(!SELF_SRC || !/^https?:$/.test(location.protocol)) return;
  if(Date.now() - lastUpdCheck < 30000) return;
  lastUpdCheck = Date.now();
  let txt;
  try{
    const r = await fetch(location.pathname + '?cb=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    txt = await r.text();
  }catch(e){ return; }
  const el = new DOMParser().parseFromString(txt, 'text/html').querySelector('script');
  if(!el) return;
  const fresh = strHash(el.textContent);
  if(fresh === BUILD) return;
  if(new URLSearchParams(location.search).get('v') === fresh) return;
  location.replace(location.pathname + '?v=' + fresh + location.hash);
}

/* ---------- boot ---------- */
/* During the trip open on Today at the live day; before or after, on Trip. */
function land(){
  const now = NOW(), ph = phase(now), live = liveDay(now);
  lastLive = live;
  cur = live >= 0 ? live : 0;
  show(ph === 'during' ? 'today' : 'trip');
}
land();
checkForUpdate();
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible') return;
  checkForUpdate();
  /* Left open overnight: move on to the new day if the page was on the old one. */
  const live = liveDay(NOW());
  if(live !== lastLive && phase(NOW()) === 'during' && (tab !== 'today' || cur === lastLive)) cur = live;
  lastLive = live;
  render();
});
window.addEventListener('pageshow', e => { if(e.persisted) checkForUpdate(); });
</script>
